<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <h1>Set a New Password</h1>

    <form action="{{ url_for('reset_password', token=token) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>New Password</label><br>
        <div class="password-wrapper">
            <input type="password" name="new_password" id="new_password" required>
            <button type="button" class="password-toggle-btn" onclick="togglePassword('new_password', this)">Show</button>
        </div>
        <br><br>

        <label>Confirm New Password</label><br>
        <div class="password-wrapper">
            <input type="password" name="confirm_password" id="confirm_password" required>
            <button type="button" class="password-toggle-btn" onclick="togglePassword('confirm_password', this)">Show</button>
        </div>
        <br><br>

        <button type="submit">Reset Password</button>
    </form>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "Hide";
            } else {
                input.type = "password";
                btn.textContent = "Show";
            }
        }
    </script>

</body>
</html>
