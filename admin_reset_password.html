<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset User Password</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <h1>Reset Password</h1>

    <p>Setting a new password for: <strong>{{ target_user["fullname"] }}</strong>
       ({{ target_user["email"] or target_user["matric_no"] }})</p>

    <form action="{{ url_for('admin_reset_password', user_id=target_user['id']) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>New Password</label><br>
        <div class="password-wrapper">
            <input type="password" name="new_password" id="new_password" required>
            <button type="button" class="password-toggle-btn" onclick="togglePassword('new_password', this)">Show</button>
        </div>
        <br><br>

        <label>Confirm New Password</label><br>
        <div class="password-wrapper">
            <input type="password" name="confirm_password" id="confirm_password" required>
            <button type="button" class="password-toggle-btn" onclick="togglePassword('confirm_password', this)">Show</button>
        </div>
        <br><br>

        <button type="submit">Set New Password</button>
        <a href="/admin">Cancel</a>
    </form>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "Hide";
            } else {
                input.type = "password";
                btn.textContent = "Show";
            }
        }
    </script>

</body>
</html>
